version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: finance_tracker_postgres_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    labels:
      - "project=finance_tracker"
      - "environment=development"
      - "service=postgres"
      - postgres_data:/var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data

  celery:
    build: .
    container_name: finance_tracker_celery_dev
    restart: unless-stopped
    command: celery -A finance_tracker worker --loglevel=info
    env_file:
      - .env
    environment:
      - DEBUG=False
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./media:/app/media
    depends_on:
      - postgres
      - redis
    labels:
      - "project=finance-tracker"
      - "environment=development"

  redis:
    image: redis:7-alpine
    container_name: redis_finance_tracker_dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}

  # promtail:
