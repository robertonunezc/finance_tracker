version: '3.8'

services:
  db:
    image: postgres:latest
    name: finance_tracker_postgres
    tags:
      - postgres
      - database
      - finance_tracker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:
    name: finance_tracker_django
    tags:
      - django
      - web
      - finance_tracker
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/bin/sh", "-c", "./entrypoint.sh"]
    volumes:
      - .:/app
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
