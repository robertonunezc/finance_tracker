version: '3.8'

x-app-environment: &app-environment
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/0"

x-app-service: &app-service
  build: .
  image: finance_tracker_app:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *app-environment
  volumes:
    - media_data:/app/media
    - staticfiles_data:/app/staticfiles
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  labels:
    - "project=finance-tracker"
    - "environment=production"

services:
  web:
    <<: *app-service
    container_name: finance_tracker_web
    command: /app/entrypoint.sh
    ports:
      - "${WEB_PORT:-8000}:8000"
    labels:
      - "project=finance-tracker"
      - "environment=production"
      - "service=web"

  bot:
    <<: *app-service
    container_name: finance_tracker_bot
    command: python -m telegram_bot.main
    labels:
      - "project=finance-tracker"
      - "environment=production"
      - "service=bot"

  celery:
    <<: *app-service
    container_name: finance_tracker_celery
    command: celery -A finance_tracker worker --loglevel=info
    labels:
      - "project=finance-tracker"
      - "environment=production"
      - "service=celery"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: finance_tracker_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "project=finance-tracker"
      - "environment=production"
      - "service=postgres"

  redis:
    image: redis:7-alpine
    container_name: finance_tracker_redis
    restart: unless-stopped
    env_file:
      - .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "project=finance-tracker"
      - "environment=production"
      - "service=redis"

volumes:
  postgres_data:
  redis_data:
  media_data:
  staticfiles_data:
