version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: finance_tracker_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    labels:
      - "project=finance-tracker"
      - "environment=production"
      - "service=postgres"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: finance_tracker_web_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=False
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis
    labels:
      - "project=finance-tracker"
      - "environment=production"
      - "service=web"

  celery:
    build: .
    container_name: finance_tracker_celery_prod
    restart: unless-stopped
    command: celery -A finance_tracker worker --loglevel=info
    env_file:
      - .env
    environment:
      - DEBUG=False
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./media:/app/media
    depends_on:
      - postgres
      - redis
    labels:
      - "project=finance-tracker"
      - "environment=production"
      - "service=celery"
  redis:
    image: redis:7-alpine
    container_name: redis_finance_tracker_prod
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}


volumes:
  postgres_data:
